services:
  catalogue:
    build: ./catalogue # . means present working directory , goto catalogue and build the image
    image: achyuth369/catalogue:1.0.0
    container_name: catalogue
    depends_on:
    - mongodb
  user:
    build: ./user
    image: achyuth369/user:1.0.0
    container_name: user
    depends_on:
    - redis

  cart: 
    build: ./cart
    image: achyuth369/cart:1.0.0
    container_name: cart
    depends_on:
    - redis
    - catalogue

  shipping:
    build: ./shipping
    image: achyuth369/shipping:1.0.0
    container_name: shipping
    depends_on:
    - mysql
    - cart
  payment:
    build: ./payment
    image: achyuth369/payment:1.0.0
    container_name: payment
    environment:
    - CART_HOST:"cart"
    - CART_PORT:"8080"
    - USER_HOST:"user"
    - USER_PORT:"8080"
    - AMQP_HOST:"rabbitmq"
    - AMQP_USER:"roboshop"
    - AMQP_PASSWORD:"roboshop123"
    depends_on:
    - rabbitmq
    - cart
    - user

  frontend:
    build: ./frontend
    image: achyuth369/frontend:1.0.0
    container_name: frontend
    ports:
    - "80:80"
    depends_on:
    - catalogue
    - user
    - cart
    - shipping
    - payment
  mongodb:
    build: ./mongodb
    image: achyuth369/mongodb:1.0.0
    container_name: mongodb
  redis:
    image: redis:7.0
    container_name: redis
  mysql: 
    build: ./mysql
    image: achyuth369/mysql:1.0.0
    container_name: mysql
  rabbitmq:
    image: rabbitmq:3
    environment:
      RABBITMQ_DEFAULT_USER: roboshop
      RABBITMQ_DEFAULT_PASS: roboshop123
    container_name: rabbitmq
    

networks:
  default:
    driver: bridge
    name: roboshop
    external: false #if it true , you need to create te network manually
